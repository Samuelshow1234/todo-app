
name: My First CI Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  first-job:
    name: My First GitHub Actions Job
    runs-on: ubuntu-latest

    steps:
      - name: Display welcome message
        run: echo "Welcome to GitHub Actions"

      - name: Display current directory
        run: pwd

      - name: Display files
        run: ls -la

      - name: Check Docker version
        run: docker --version

